# render.yaml
services:
  - type: web
    name: swiggy-firebase-creator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /tmp/swiggy_fb
      - key: PYTHON_VERSION
        value: "3.11.9"
